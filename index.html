<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>PhishGuard Training</title><style>body{background:#101820;color:#e2f5ee;font:18px system-ui;max-width:680px;margin:40px auto;padding:20px}pre{white-space:pre-wrap;background:#20313c;padding:20px}button{padding:12px;margin:8px;cursor:pointer}h1{color:#70e4ad}</style><h1>PhishGuard Training</h1><p id="progress"></p><pre id="code"></pre><div id="choices"></div><p id="feedback" aria-live="polite"></p><button id="next" hidden>Next</button><script>
const q=[
['email = "Reset your password"\nif "password" in email:\n    print("Alert")\nelse:\n    print("Normal")',['Alert','Normal'],0,'The keyword is present.'],
['email = "Your account is locked"\nif "urgent" in email or "account" in email:\n    print("Warning")\nelse:\n    print("Normal")',['Warning','Normal'],0,'OR requires at least one match.'],
['email = "Change your password"\nif "password" in email and "urgent" in email:\n    print("High risk")\nelse:\n    print("Low risk")',['High risk','Low risk'],1,'AND requires both matches.'],
['email = "Urgent account verification"\nif "urgent" in email:\n    print("Alert")\nelse:\n    print("Normal")',['Alert','Normal'],1,'Python string matching is case sensitive.'],
['email = "Verify your account"\nif "verify" in email.lower():\n    print("Suspicious")\nelse:\n    print("Normal")',['Suspicious','Normal'],0,'lower() normalizes case.']];
let i=0,xp=0;const el=id=>document.getElementById(id);
function render(){el('progress').textContent='Mission '+Math.min(i+1,q.length)+' / '+q.length+' | XP '+xp;el('choices').replaceChildren();el('feedback').textContent='';el('next').hidden=true;if(i===q.length){el('code').textContent='Campaign complete: '+(xp===500?'Junior Defender':xp>=300?'Cyber Trainee':'Recruit');let b=document.createElement('button');b.textContent='Replay';b.onclick=()=>{i=0;xp=0;render()};el('choices').append(b);return}const [code,answers,correct,why]=q[i];el('code').textContent=code;answers.forEach((a,j)=>{let b=document.createElement('button');b.textContent=a;b.onclick=()=>{if(j===correct)xp+=100;el('feedback').textContent=(j===correct?'Correct! ':'Incorrect. ')+why;for(const b of el('choices').children)b.disabled=true;el('next').hidden=false};el('choices').append(b)})}el('next').onclick=()=>{i++;render()};render();
</script></html>
